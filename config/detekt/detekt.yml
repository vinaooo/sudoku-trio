# Built upon detekt's default config (buildUponDefaultConfig = true); only overrides live here.
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Test', 'ParameterizedTest', 'Property']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][A-Za-z0-9_]*'

complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Preview']

style:
  MagicNumber:
    ignoreEnums: true
    ignorePropertyDeclaration: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreAnnotated: ['Composable', 'Preview']
    excludes: ['**/test/**', '**/androidTest/**']
  ReturnCount:
    max: 3
    excludeGuardClauses: true
  UnusedPrivateMember:
    ignoreAnnotated: ['Preview']

Compose:
  ModifierMissing:
    active: true
  ViewModelForwarding:
    active: true
